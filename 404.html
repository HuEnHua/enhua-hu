<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — En Hua Hu</title>
  <link rel="shortcut icon" href="/images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b282e; --muted: #5d6b72; --teal-link: #1f5b78; --teal-hover: #0F2E3D;
      --display: 'Roboto Slab', Georgia, serif;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0; background: #fff; color: var(--ink); font-family: var(--body);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 0 24px;
    }
    h1 { font-family: var(--display); font-weight: 700; font-size: 40px; margin: 0 0 12px; letter-spacing: -0.01em; }
    p { color: var(--muted); font-size: 17px; line-height: 1.6; margin: 0 0 24px; }
    a { color: var(--teal-link); text-decoration: none; border-bottom: 1px solid rgba(31,91,120,0.35); }
    a:hover { color: var(--teal-hover); border-bottom-color: currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page has moved or no longer exists.</p>
    <p><a href="/">Go to the homepage</a></p>
  </main>
</body>
</html>
